name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Unit test (native)
        run: pio test -e native

      - name: Build TTGO T-Display
        run: pio run -e ttgo-t-display

      - name: Build OTA
        run: pio run -e ota

      - name: Build ESP32 Generic (no display)
        run: pio run -e esp32-generic
      - name: Build filesystem (LittleFS)
        run: pio run -e ttgo-t-display -t buildfs